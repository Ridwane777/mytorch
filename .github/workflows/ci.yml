name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts my_torch_analyzer
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: make re
