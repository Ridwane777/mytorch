name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y libcriterion-dev clang-format
      - name: Format
        run: find include src tests -name '*.[ch]pp' | xargs clang-format --dry-run --Werror
      - name: Build
        run: make re
      - name: Test
        run: make tests_run
