# Convolutional network for the chessboard (#29, ADR-0037), compared with the dense network of
# final_network.conf (docs/performance/20-cnn.md).
# Same input encoding, labels, loss, optimizer and train line as final_network.conf, so that only
# the architecture changes:
#   - board_planes turns the 901 inputs of fen-attacks-901 (12 piece planes, 5 game-state scalars,
#     2 attack planes) into 19 planes of 8 x 8: the scalars are repeated on the 64 squares;
#   - two 3x3 convolutions (padding 1 keeps 8 x 8), a 2x2 max pooling, then a dense head;
#   - convolution weights are drawn with He normal (the layer's default).
input fen-attacks-901 901
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=1 batch=64 seed=42 patience=3 validation_tail=0
init seed=1

layers 10
board_planes inputs=901 scalars=768 count=5
conv2d channels=19 height=8 width=8 filters=16 kernel=3 stride=1 padding=1
relu
conv2d channels=16 height=8 width=8 filters=32 kernel=3 stride=1 padding=1
relu
max_pool2d channels=32 height=8 width=8 size=2 stride=2
dense 512 128
relu
dense 128 5
softmax
