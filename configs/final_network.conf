# Final chess network (#17), first version: the choices measured so far.
#   - input encoding fen-attacks-901 (ADR-0016);
#   - natural class distribution, no weights (ADR-0018);
#   - trained by scripts/train_final.sh on the augmented training split (ADR-0017, ADR-0019), with
#     the untouched validation split appended at the end of the file: validation_tail is set by
#     the script to its number of lines (ADR-0022);
#   - two hidden layers 256 and 128 with the default initialisation, chosen by the trial runs of
#     #17 on the validation split (ADR-0023, docs/performance/trials.md).
input fen-attacks-901 901
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=30 batch=64 seed=42 patience=3 validation_tail=0
init seed=1

layers 6
dense 901 256
relu
dense 256 128
relu
dense 128 5
softmax
