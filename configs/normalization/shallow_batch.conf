# Normalization benchmark (#30, ADR-0033, docs/performance/17-normalization.md): the final architecture, 901 -> 256 -> 128 -> 5, batch normalization after each hidden Dense.
# Trained by scripts/bench_normalization.sh with scripts/train_final.sh at 10 % of the data, scored
# on the validation split; everything but the layers is configs/final_network.conf.
input fen-attacks-901 901
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=30 batch=64 seed=42 patience=3 validation_tail=0
init seed=1

layers 8
dense 901 256
batch_norm 256
relu
dense 256 128
batch_norm 128
relu
dense 128 5
softmax
