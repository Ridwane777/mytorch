# Residual CNN (#31, ADR-0046): the six convolutions of cnn_deep.conf, the last four in two
# residual blocks (conv, relu, conv, plus the shortcut), each followed by a relu as in ResNet.
input fen-attacks-901 901
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
# Same budget for the three networks of docs/performance/28-residual.md: 10 epochs, no early
# stopping; validation_tail is set by scripts/bench_residual.sh to the size of the validation part.
train epochs=10 batch=64 seed=42 patience=0 validation_tail=0
init seed=1

layers 14
to_planes inputs=901 scalars=768 count=5 height=8 width=8
conv2d channels=19 height=8 width=8 filters=32 kernel=3 stride=1 padding=1
relu
conv2d channels=32 height=8 width=8 filters=32 kernel=3 stride=1 padding=1
relu
residual layers=3
conv2d channels=32 height=8 width=8 filters=32 kernel=3 stride=1 padding=1
relu
conv2d channels=32 height=8 width=8 filters=32 kernel=3 stride=1 padding=1
relu
residual layers=3
conv2d channels=32 height=8 width=8 filters=32 kernel=3 stride=1 padding=1
relu
conv2d channels=32 height=8 width=8 filters=32 kernel=3 stride=1 padding=1
relu
