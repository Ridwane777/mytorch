# Combiner of a stacked ensemble (#40, ADR-0045): reads the probabilities of two members side by
# side (dense then CNN, 5 labels each) and gives the 5 probabilities. A logistic regression (one
# dense layer and softmax): 55 parameters, little to overfit. Trained by my_torch_ensemble stack on
# the validation part, with 20 % of it held out for early stopping.
input member-probabilities 10
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.01
scheduler none
train epochs=50 batch=64 seed=42 patience=3 validation=0.2
init seed=1

layers 2
dense 10 5
softmax
