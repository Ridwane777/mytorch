# Candidate chess network (#10, ADR-0030): configs/final_network.conf with the best combination of
# the hyperparameter search (docs/performance/15-hyperparameters.md, combination 15):
#   - batches of 32 instead of 64;
#   - hidden layers 512 and 256 instead of 256 and 128;
#   - dropout 0.2 after each hidden ReLU.
# Everything else is unchanged. Trained by scripts/train_final.sh, which sets validation_tail, and
# compared with the final network on the test split.
input fen-attacks-901 901
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=30 batch=32 seed=42 patience=3 validation_tail=0
init seed=1

layers 8
dense 901 512
relu
dropout rate=0.2
dense 512 256
relu
dropout rate=0.2
dense 256 5
softmax
