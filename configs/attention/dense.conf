# Reference (#32): the dense network of configs/final_network.conf, two hidden layers 256 and 128.
input fen-attacks-901 901
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
# Same budget for the networks of docs/performance (#32): 10 epochs, no early stopping;
# validation_tail is set by the benchmark script to the size of the validation part.
train epochs=10 batch=64 seed=42 patience=0 validation_tail=0
init seed=1

layers 6
dense 901 256
relu
dense 256 128
relu
dense 128 5
softmax
