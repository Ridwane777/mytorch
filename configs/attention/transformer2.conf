# Mini transformer (#32, ADR-0047), 2 pre-norm blocks: 64 tokens (one per square) of 19 features
# (12 piece planes, 2 attack planes, 5 game scalars), embedded to 32 with a learned position per
# square, 2 x [residual(norm, 4-head self-attention), residual(norm, 32-128-32 MLP)], then the head
# flatten (64 x 32 = 2048) -> dense 128 -> dense 5.
input fen-attacks-901 901
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
# Same budget for the networks of docs/performance (#32): 10 epochs, no early stopping;
# validation_tail is set by the benchmark script to the size of the validation part.
train epochs=10 batch=64 seed=42 patience=0 validation_tail=0
init seed=1

layers 11
to_tokens inputs=901 scalars=768 count=5 tokens=64
token_dense tokens=64 inputs=19 outputs=32
positional tokens=64 dim=32
residual layers=2
token_norm tokens=64 dim=32
self_attention tokens=64 dim=32 heads=4
residual layers=4
token_norm tokens=64 dim=32
token_dense tokens=64 inputs=32 outputs=128
relu
token_dense tokens=64 inputs=128 outputs=32
residual layers=2
token_norm tokens=64 dim=32
self_attention tokens=64 dim=32 heads=4
residual layers=4
token_norm tokens=64 dim=32
token_dense tokens=64 inputs=32 outputs=128
relu
token_dense tokens=64 inputs=128 outputs=32
dense 2048 128
relu
dense 128 5
softmax
