# Basic chess network: one hidden layer (docs/configuration.md lists every key).
input fen-onehot-768 768
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=20 batch=64 seed=42 patience=5 validation=0.1
init seed=1

layers 4
dense 768 128 l2=0.0003
relu
dense 128 5
softmax
