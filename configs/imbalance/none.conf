# Class imbalance benchmark (#16, ADR-0018), option none: the natural distribution, no correction.
# The four options share this network and training; only the loss line or the training file
# (scripts/resample_imbalance.py) changes. validation=0 patience=0: a validation split drawn from an
# oversampled file would hold duplicates of training positions (ADR-0018).
# Encoding: fen-onehot-768, the one the analyzer knows (the 385-wide encoding of the encoding
# benchmark can replace it: change `input` and the first dense layer in the four files).
input fen-onehot-768 768
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=20 batch=64 seed=42 patience=0 validation=0
init seed=1

layers 4
dense 768 128 l2=0.0003
relu
dense 128 5
softmax
