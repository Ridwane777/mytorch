# Class imbalance benchmark (#16, ADR-0018), option oversample: the training file is resampled by
# scripts/resample_imbalance.py (minority positions duplicated up to the majority count); the
# network and the loss are those of none.conf. validation=0 patience=0: a validation split drawn
# from an oversampled file would hold duplicates of training positions (ADR-0018).
input fen-onehot-768 768
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=20 batch=64 seed=42 patience=0 validation=0
init seed=1

layers 4
dense 768 128 l2=0.0003
relu
dense 128 5
softmax
