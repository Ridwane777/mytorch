# Class imbalance benchmark (#16, ADR-0018), option weighted: the loss is weighted by the inverse
# frequency of each class. The weights on the loss line are a PLACEHOLDER (all 1, i.e. no
# weighting): scripts/bench_imbalance.sh replaces them, in a copy of this file, with the inverse
# frequencies of the training sample's classes normalised to mean 1, in the order of the labels
# below (scripts/resample_imbalance.py weights). Network and training as in none.conf.
input fen-onehot-768 768
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy weights=1,1,1,1,1
optimizer adam lr=0.001
scheduler none
train epochs=20 batch=64 seed=42 patience=0 validation=0
init seed=1

layers 4
dense 768 128 l2=0.0003
relu
dense 128 5
softmax
