# Network of the augmentation benchmark (scripts/bench_augmentation.sh, docs/performance/05-augmentation.md).
# Same layers as basic_network.conf. Early stopping is off and nothing is held out of the training
# file: the augmented file contains symmetric twins of its positions, which would leak into a
# random validation split (ADR-0019). The number of epochs is fixed, so both arms run the same
# number of epochs (the augmented arm therefore makes four times more updates).
input fen-onehot-768 768
labels 5
Nothing
Check White
Check Black
Checkmate White
Checkmate Black

loss cross_entropy
optimizer adam lr=0.001
scheduler none
train epochs=20 batch=64 seed=42 validation=0
init seed=1

layers 4
dense 768 128 l2=0.0003
relu
dense 128 5
softmax
