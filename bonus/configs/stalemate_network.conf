# Six-class network for the stalemate bonus (#24): the five outputs of the specification plus Stalemate.
input fen-onehot-768 768
labels 6
Nothing
Check White
Check Black
Checkmate White
Checkmate Black
Stalemate

loss cross_entropy
optimizer adam lr=0.001
train epochs=30 batch=64 seed=42 patience=5 validation=0.1
init seed=1

layers 4
dense 768 128
relu
dense 128 6
softmax
